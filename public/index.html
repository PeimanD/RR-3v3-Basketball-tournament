<!doctype html>
<!-- SPDX-License-Identifier: MIT -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3v3 Round Robin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@600;700&display=swap">
<style id="app-style">
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#14202B; --ink-2:#465564; --ink-3:#6B7987;
  --line:#D3DAE2; --line-2:#E4E9EE;
  --accent:#C24E0E; --accent-bright:#F2843A; --accent-ink:#FFFFFF; --accent-soft:#FCE9DA;
  --court:#1B466D; --court-2:#255985; --court-3:#2C6697;
  --court-ink:#FFFFFF; --court-ink-2:rgba(255,255,255,.74);
  --paint:rgba(255,255,255,.5); --tick-off:rgba(255,255,255,.2);
  --bk-card:#FFFFFF; --bk-ink:#14202B; --bk-ink-2:#6B7987; --bk-div:#E2E7ED;
  --ok:#1E9A5A; --danger:#B3292B; --danger-soft:#FBE5E4; --scrim:rgba(9,15,22,.5);
  --c0:#2F6FED; --c0-ink:#FFFFFF;
  --c1:#16935A; --c1-ink:#FFFFFF;
  --c2:#7E51DE; --c2-ink:#FFFFFF;
  --c3:#CA3254; --c3-ink:#FFFFFF;
  --c4:#E1AE17; --c4-ink:#201A05;
  --c5:#0B8A8F; --c5-ink:#FFFFFF;
  --c6:#B8378A; --c6-ink:#FFFFFF;
  --c7:#5F8417; --c7-ink:#FFFFFF;
  --c8:#8A5A33; --c8-ink:#FFFFFF;
  --c9:#4E6278; --c9-ink:#FFFFFF;
  --font:"Barlow","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font-cond:"Barlow Condensed","Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D141C; --surface:#151F2A; --ink:#E5EBF1; --ink-2:#A6B3C0; --ink-3:#7C8A98;
    --line:#2A3745; --line-2:#1E2935;
    --accent:#FF8A45; --accent-bright:#FF8A45; --accent-ink:#1F0E03; --accent-soft:#3A2416;
    --court:#12304C; --court-2:#1A3F62; --court-3:#204A72;
    --court-ink:#F1F5F9; --court-ink-2:rgba(241,245,249,.7);
    --paint:rgba(235,242,248,.42); --tick-off:rgba(235,242,248,.16);
    --bk-card:#1B2835; --bk-ink:#E5EBF1; --bk-ink-2:#8D9AA8; --bk-div:#2A3745;
    --ok:#3CC47F; --danger:#FF7B73; --danger-soft:#3A1C1B; --scrim:rgba(0,0,0,.62);
    --c0:#5D90F6; --c0-ink:#08132E;
    --c1:#30BE7A; --c1-ink:#03200F;
    --c2:#A587F4; --c2-ink:#160A32;
    --c3:#EF6587; --c3-ink:#2A0510;
    --c4:#F0C64A; --c4-ink:#231C04;
    --c5:#2EC4C9; --c5-ink:#032526;
    --c6:#E26BB6; --c6-ink:#2A0820;
    --c7:#9BC23F; --c7-ink:#172105;
    --c8:#C99467; --c8-ink:#24150A;
    --c9:#8EA3BA; --c9-ink:#0E1620;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D141C; --surface:#151F2A; --ink:#E5EBF1; --ink-2:#A6B3C0; --ink-3:#7C8A98;
  --line:#2A3745; --line-2:#1E2935;
  --accent:#FF8A45; --accent-bright:#FF8A45; --accent-ink:#1F0E03; --accent-soft:#3A2416;
  --court:#12304C; --court-2:#1A3F62; --court-3:#204A72;
  --court-ink:#F1F5F9; --court-ink-2:rgba(241,245,249,.7);
  --paint:rgba(235,242,248,.42); --tick-off:rgba(235,242,248,.16);
  --bk-card:#1B2835; --bk-ink:#E5EBF1; --bk-ink-2:#8D9AA8; --bk-div:#2A3745;
  --ok:#3CC47F; --danger:#FF7B73; --danger-soft:#3A1C1B; --scrim:rgba(0,0,0,.62);
  --c0:#5D90F6; --c0-ink:#08132E;
  --c1:#30BE7A; --c1-ink:#03200F;
  --c2:#A587F4; --c2-ink:#160A32;
  --c3:#EF6587; --c3-ink:#2A0510;
  --c4:#F0C64A; --c4-ink:#231C04;
  --c5:#2EC4C9; --c5-ink:#032526;
  --c6:#E26BB6; --c6-ink:#2A0820;
  --c7:#9BC23F; --c7-ink:#172105;
  --c8:#C99467; --c8-ink:#24150A;
  --c9:#8EA3BA; --c9-ink:#0E1620;
}

*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.sheet-open{overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* Header */
.top{padding:18px 0 0}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font:700 30px/1.05 var(--font-cond);letter-spacing:.005em;min-width:0;overflow-wrap:anywhere}
.format{margin:6px 0 0;color:var(--ink-2);font-size:14.5px}
.rules-link{color:var(--accent);font-weight:600;text-underline-offset:3px;white-space:nowrap}
.status-line{display:flex;align-items:center;gap:8px;margin:4px 0 0;font-size:13px;color:var(--ink-3)}
.status-line .edit-flag{font-weight:600;font-size:12px;line-height:1;padding:5px 9px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
.menu-btn{-webkit-appearance:none;appearance:none;flex:none;display:inline-flex;align-items:center;gap:8px;margin:0;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font-weight:600;font-size:14.5px;line-height:1;cursor:pointer}
.menu-icon{width:16px;height:12px;background:linear-gradient(currentColor,currentColor) 0 0/100% 2px no-repeat,linear-gradient(currentColor,currentColor) 0 5px/100% 2px no-repeat,linear-gradient(currentColor,currentColor) 0 10px/100% 2px no-repeat}

/* Now on court */
.now{margin-top:14px;padding:16px 16px 13px;border-radius:14px;background:var(--court);color:var(--court-ink);outline:2px solid var(--paint);outline-offset:-7px}
.now-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 12px;padding:2px 4px 0}
.now-title{margin:0;font:700 23px/1.1 var(--font-cond)}
.now-sub{font-size:13px;color:var(--court-ink-2)}
.courts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0 10px}
.court-tile{-webkit-appearance:none;appearance:none;border:0;margin:0;min-width:0;padding:10px 10px 12px;border-radius:9px;background:var(--court-2);color:var(--court-ink);text-align:left;cursor:pointer}
.court-tile:hover{background:var(--court-3)}
.ct-label{display:block;font-size:12.5px;line-height:1.3;color:var(--court-ink-2)}
.ct-match{display:flex;align-items:center;gap:8px;margin-top:8px}
.ct-vs{font-size:13px;color:var(--court-ink-2)}
.now-foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0;padding:0 4px;font-size:14px}
.now-msg{margin:10px 4px 10px;font-size:14.5px}
.now .btn{margin:0 4px 6px}
.ticks{display:flex;gap:3px;margin:12px 4px 2px}
.tick{flex:1;min-width:2px;height:4px;border-radius:2px;background:var(--tick-off)}
.tick.on{background:var(--accent-bright)}
.tick.split{margin-left:9px}
.champ-row{display:flex;align-items:center;gap:14px;margin:12px 4px 10px}
.champ-name{margin:0;font:700 30px/1 var(--font-cond)}
.champ-players{margin:4px 0 0;font-size:13.5px;color:var(--court-ink-2)}
.now.reveal{animation:reveal .7s cubic-bezier(.2,.8,.2,1)}
@keyframes reveal{from{transform:scale(.97);opacity:.35}to{transform:none;opacity:1}}

/* Team badges */
.badge{display:inline-grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;font:700 16px/1 var(--font-cond);background:var(--team,var(--line));color:var(--team-ink,var(--ink))}
.badge.two{font-size:13px;letter-spacing:-.01em}
.tc0{--team:var(--c0);--team-ink:var(--c0-ink)}
.tc1{--team:var(--c1);--team-ink:var(--c1-ink)}
.tc2{--team:var(--c2);--team-ink:var(--c2-ink)}
.tc3{--team:var(--c3);--team-ink:var(--c3-ink)}
.tc4{--team:var(--c4);--team-ink:var(--c4-ink)}
.tc5{--team:var(--c5);--team-ink:var(--c5-ink)}
.tc6{--team:var(--c6);--team-ink:var(--c6-ink)}
.tc7{--team:var(--c7);--team-ink:var(--c7-ink)}
.tc8{--team:var(--c8);--team-ink:var(--c8-ink)}
.tc9{--team:var(--c9);--team-ink:var(--c9-ink)}
.badge.sm{width:22px;height:22px;font-size:13.5px}
.badge.sm.two{font-size:10.5px}
.badge.md{width:32px;height:32px;font-size:18px}
.badge.md.two{font-size:14px}
.badge.xl{width:54px;height:54px;font-size:31px}
.badge.xl.two{font-size:24px}
.badge.empty{background:transparent;border:1.5px dashed var(--line);color:var(--ink-3);font-size:13px}
.now .badge.empty{border-color:var(--paint);color:var(--court-ink-2)}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px;padding:10px 0;background:var(--bg);border-bottom:1px solid var(--line)}
.tab{-webkit-appearance:none;appearance:none;margin:0;padding:11px 4px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink-2);font-weight:600;font-size:15px;line-height:1;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}

/* Rounds and games */
.panel{padding:4px 0 28px}
.round{position:relative;padding:16px 0 4px}
.round + .round{border-top:1px solid var(--line)}
.round.is-now::before{content:"";position:absolute;left:-10px;top:18px;bottom:12px;width:3px;border-radius:2px;background:var(--accent)}
.round-head{display:flex;align-items:center;gap:10px}
.round-head h2{margin:0;font:700 21px/1.1 var(--font-cond)}
.chip{font-size:12px;font-weight:600;line-height:1;padding:5px 9px;border-radius:999px}
.chip[data-s="now"]{background:var(--accent);color:var(--accent-ink)}
.chip[data-s="done"]{color:var(--ink-3);padding-left:0}
.sits{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:5px 0 8px;font-size:14px;color:var(--ink-2)}
.game{margin:8px 0;padding:10px 10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.game.locked{background:transparent;border-style:dashed}
.game.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}
.game-meta{display:flex;align-items:baseline;gap:10px;margin-bottom:9px;font-size:13px;color:var(--ink-3)}
.game-meta .court{font-weight:600;color:var(--ink-2);white-space:nowrap}
.game-meta .gname{font-weight:700;font-size:14px;color:var(--ink)}
.game-meta .gnum{margin-left:auto;white-space:nowrap}
.matchup{display:grid;grid-template-columns:minmax(0,1fr) 52px 10px 52px minmax(0,1fr);align-items:center;column-gap:6px}
.side{display:grid;grid-template-columns:28px minmax(0,1fr);grid-template-areas:"b n" "s s";align-items:center;column-gap:7px;row-gap:3px;min-width:0}
.side .badge{grid-area:b}
.side .tname{grid-area:n;min-width:0;font-weight:600;font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.side .sub{grid-area:s;font-size:12px;line-height:1.3;color:var(--ink-3);overflow-wrap:anywhere}
.side-2{grid-template-columns:minmax(0,1fr) 28px;grid-template-areas:"n b" "s s";text-align:right}
.side.placeholder .tname{font-weight:500;font-size:14px;color:var(--ink-2)}
.side.win .tname{font-weight:700}
.side.lose{opacity:.5}
.dash{text-align:center;color:var(--ink-3)}
.score{width:100%;height:48px;margin:0;padding:0;text-align:center;font:700 25px/1 var(--font-cond);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;-webkit-appearance:none;appearance:none}
.score:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.score.win{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--surface)}
.score:disabled{opacity:.5}
.score[readonly]{pointer-events:none;cursor:default}
.score::placeholder{color:var(--ink-3);opacity:1}
.game.is-tie .score{border-color:var(--danger);background:var(--danger-soft)}
.note{margin:9px 0 0;font-size:13px;line-height:1.35;color:var(--danger)}
.note.info{color:var(--ink-3)}
.next{margin:8px 0 0;font-size:12.5px;line-height:1.35;color:var(--ink-3)}

/* Standings */
.lead{margin:14px 0 6px;font-size:15px;color:var(--ink-2)}
.lead strong{color:var(--ink)}
.table-wrap{overflow-x:auto;margin:6px 0 14px}
table{width:100%;border-collapse:collapse}
th{padding:8px 6px;font-size:12.5px;font-weight:600;color:var(--ink-3);text-align:right;border-bottom:1px solid var(--line)}
td{padding:10px 6px;text-align:right;vertical-align:middle;border-bottom:1px solid var(--line-2);font-variant-numeric:tabular-nums}
th.l,td.l{text-align:left}
td.seed{width:30px;text-align:left;font:700 21px/1 var(--font-cond)}
td.num{font:600 19px/1.1 var(--font-cond);white-space:nowrap}
tr.out td{color:var(--ink-3)}
tr.cut td{padding:6px 0 4px;border-bottom:2px solid var(--line);text-align:left;font-size:12px;font-weight:600;color:var(--ink-3)}
.tb{display:block;margin-top:2px;font:500 11px/1.2 var(--font);color:var(--ink-3)}
.team-cell{display:flex;align-items:center;gap:9px;min-width:0}
.tc{display:flex;flex-direction:column;min-width:0}
.tc .tname{font-weight:600;font-size:15px;line-height:1.2}
.tc .sub{font-size:12px;line-height:1.3;color:var(--ink-3)}
abbr{text-decoration:none}
.fine{margin:8px 0 0;font-size:13px;line-height:1.45;color:var(--ink-3)}
.callout{margin:12px 0;padding:12px;border:1px solid var(--accent);border-radius:10px;background:var(--accent-soft)}
.callout p{margin:0;font-size:14.5px}
.callout .btn{margin-top:10px}
.btn{-webkit-appearance:none;appearance:none;border:0;margin:0;padding:11px 15px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;line-height:1;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn-quiet{-webkit-appearance:none;appearance:none;margin:0;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink-2);font-weight:500;font-size:14px;line-height:1;cursor:pointer}
.btn-quiet.armed,.btn-quiet.danger.armed{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
.btn-quiet.danger{color:var(--danger)}

/* Bracket */
.court-panel{margin:14px 0 4px;padding:16px 14px 12px;border-radius:14px;background:var(--court);color:var(--court-ink);outline:2px solid var(--paint);outline-offset:-7px}
.court-panel h3{margin:4px 4px 6px;font:700 18px/1.1 var(--font-cond)}
.bk-third-wrap{margin-top:14px}
.bk{display:block;width:100%;max-width:520px;height:auto;margin:0 auto;overflow:visible}
.bk-card{fill:var(--bk-card)}
.bk-div{stroke:var(--bk-div);stroke-width:1}
.bk-label{fill:var(--court-ink);font:600 11px var(--font)}
.bk-num{fill:var(--court-ink-2);font:500 10.5px var(--font)}
.bk-seed{fill:var(--bk-ink-2);font:600 10.5px var(--font)}
.bk-badge-t{font:700 11px var(--font-cond)}
.bk-badge-t.two{font-size:8.5px}
.bk-team{fill:var(--bk-ink);font:600 12px var(--font)}
.bk-ph{fill:var(--bk-ink-2);font:italic 400 11px var(--font)}
.bk-score{fill:var(--bk-ink);font:700 15px var(--font-cond)}
.bk-row.win .bk-score{fill:var(--accent)}
.bk-row.lose{opacity:.45}
.bk-row.proj{opacity:.62}
.bk-winbar{fill:var(--accent-bright)}
.bk-line{fill:none;stroke:var(--paint);stroke-width:2}
.bk-line.on{stroke:var(--accent-bright);stroke-width:2.5}
.bk-box{fill:none;stroke:var(--paint);stroke-width:1.5;stroke-dasharray:4 3}
.bk-box.set{fill:var(--bk-card);stroke:var(--accent-bright);stroke-width:2;stroke-dasharray:none}
.bk-box-label{fill:var(--court-ink-2);font:600 10.5px var(--font)}
.bk-box-label.set{fill:var(--bk-ink-2)}
.bk-box-ph{fill:var(--court-ink-2);font:italic 400 11px var(--font)}
.section-h{margin:24px 0 0;font:700 22px/1.1 var(--font-cond)}
.place-list{list-style:none;margin:10px 0 0;padding:0}
.place-list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:15px}
.place-n{width:38px;font:700 19px/1 var(--font-cond);color:var(--ink-2)}
.place-list li:first-child .place-n{color:var(--accent)}
.muted{color:var(--ink-3)}

/* Footer, publish bar, toast */
.foot{padding:16px 0 32px;border-top:1px solid var(--line)}
.foot-note{margin:0;font-size:13px;color:var(--ink-3)}
body.editing .foot{padding-bottom:120px}
.pubbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ink);color:var(--surface);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.18)}
.pubbar-in{max-width:640px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.pub-text{flex:1 1 160px;min-width:0;font-size:14px;font-weight:600}
.pub-err{flex-basis:100%;margin:0;font-size:13px;color:var(--accent-bright)}
.pubbar .btn-quiet{background:transparent;border-color:rgba(127,140,155,.6);color:inherit}
.pubbar .btn-quiet.armed{border-color:var(--accent-bright);color:var(--accent-bright);background:transparent}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:60;transform:translateX(-50%);max-width:calc(100% - 32px);padding:10px 14px;border-radius:10px;background:var(--ink);color:var(--surface);font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2)}

/* Organizer sheet */
.sheet-backdrop{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;padding-top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--scrim)}
.sheet{width:100%;max-width:640px;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:16px 16px 0 0;padding:0 16px calc(28px + env(safe-area-inset-bottom,0px))}
.sheet-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font:700 24px/1.1 var(--font-cond)}
.sheet-sec{padding:16px 0 4px}
.sheet-sec + .sheet-sec{border-top:1px solid var(--line)}
.sheet-sec h3{margin:0 0 10px;font:700 19px/1.1 var(--font-cond)}
.sheet-sec h4{margin:18px 0 8px;font-size:15px;font-weight:700}
.signin{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.signin-dot{flex:none;width:10px;height:10px;margin-top:6px;border-radius:50%;background:var(--ink-3)}
.signin-dot.on{background:var(--ok)}
.signin p{margin:0;font-size:14.5px}
.signin .fine{margin-top:4px}
.signin .btn,.signin .btn-quiet{margin-top:12px}
.signin .form-actions .btn,.signin .form-actions .btn-quiet{margin-top:0}

    i = j;
  }
  const seedOf = {};
  order.forEach((id, i) => { seedOf[id] = i + 1; });
  return { rec, games, finals, complete, order, seedOf, tags, unresolved, seedsFinal: complete && unresolved.length === 0 };
}

function computePlayoffs(st) {
  const data = S();
  const out = {};
  const showProj = !st.seedsFinal && st.finals > 0;
  function resolve(s) {
    if (s.seed) {
      const t = st.order[s.seed - 1];
      return { team: st.seedsFinal ? t : null, projTeam: showProj ? t : null, seed: s.seed, label: 'Seed ' + s.seed, short: 'Seed ' + s.seed };
    }
    const src = s.w || s.l, word = s.w ? 'Winner' : 'Loser', n = M.NUM[src];
    const base = { team: null, projTeam: null, seed: null, label: `${word} of game ${n}`, short: `${word} G${n}` };
    const r = out[src] && out[src].r;
    if (r && r.status === 'final') { base.team = s.w ? r.winner : r.loser; base.seed = st.seedOf[base.team]; }
    return base;
  }
  M.poGames.forEach(g => {
    const sides = g.slots.map(resolve);
    const ready = st.seedsFinal && !!sides[0].team && !!sides[1].team;
    const teams = ready ? [sides[0].team, sides[1].team] : null;
    const stored = data.po[g.id];
    const matches = !!(ready && stored && stored.t[0] === teams[0] && stored.t[1] === teams[1]);
    const r = matches ? result(teams[0], teams[1], stored.s) : { status: 'empty' };
    out[g.id] = { sides, ready, teams, r, stale: !!(ready && stored && !matches), scores: matches ? stored.s : [null, null] };
  });
  const places = {};
  M.poGames.forEach(g => {
    const r = out[g.id].r;
    if (r.status !== 'final' || !g.places) return;
    if (g.places.w) places[g.places.w] = r.winner;
    if (g.places.l) places[g.places.l] = r.loser;
  });
  const done = M.poGames.filter(g => out[g.id].r.status === 'final').length;
  return { games: out, places, champion: places[1] || null, done, resolve };
}
const currentPoolRound = st => M.rounds.find(r => r.games.some(g => st.games[g.id].status !== 'final')) || null;
const currentPoRound = po => {
  const i = M.poRounds.findIndex(ids => ids.some(id => po.games[id].r.status !== 'final'));
  return i < 0 ? null : i;
};
// Teams still alive that sit out a playoff round.
function restingFor(ri, po) {
  const res = [], seen = new Set();
  M.poRounds.forEach((ids, r) => {
    if (r <= ri) return;
    ids.forEach(id => M.gameById[id].slots.forEach(s => {
      const src = s.w || s.l;
      if (!s.seed && !(src && M.gameById[src].round < ri)) return;
      const rs = po.resolve(s);
      const key = rs.team || rs.label;
      if (seen.has(key)) return;
      seen.add(key);
      res.push({ rs, fromSeed: !!s.seed });
    }));
  });
  return res;
}

/* Bracket drawing (SVG): cards 110 x 52 in columns 121 apart; a feeder card lines up with the row it feeds. */
const CW = 110, CH = 52, RH = 26, GX = 11, PITCH = 103, TOP = 24, VW = 352;

function layoutTree(rootId) {
  const nodes = {};
  (function walk(id, depth) {
    const kids = [];
    M.gameById[id].slots.forEach((s, i) => { if (s.w && M.gameById[s.w]) kids.push({ i, id: s.w }); });
    nodes[id] = { id, depth, kids, top: 0, x: 0, col: 0 };
    kids.forEach(k => walk(k.id, depth + 1));
  })(rootId, 0);
  const list = Object.keys(nodes).map(k => nodes[k]);
  const maxDepth = Math.max(...list.map(n => n.depth));
  const colBottom = {};
  let nextLeaf = 0;
  const center = id => nodes[id].top + CH / 2;
  (function place(id) {
    const n = nodes[id];
    n.col = maxDepth - n.depth;
    n.kids.forEach(k => place(k.id));
    let top;
    if (!n.kids.length) top = nextLeaf;
    else if (n.kids.length === 2) top = (center(n.kids[0].id) + center(n.kids[1].id)) / 2 - CH / 2;
    else top = center(n.kids[0].id) - (n.kids[0].i === 0 ? RH / 2 : RH * 1.5);
    if (colBottom[n.col] != null) top = Math.max(top, colBottom[n.col] + PITCH - CH);
    n.top = top;
    colBottom[n.col] = top + CH;
    if (!n.kids.length) nextLeaf = top + PITCH;
  })(rootId);
  const minTop = Math.min(...list.map(n => n.top));
  list.forEach(n => { n.top += TOP - minTop; n.x = n.col * (CW + GX); });
  return { nodes, list, width: (maxDepth + 1) * CW + maxDepth * GX, height: Math.max(...list.map(n => n.top + CH)), root: nodes[rootId] };
}
function bkRow(sd, i, info, st) {
  const ry = i * RH;
  const id = sd.team || sd.projTeam;
  const proj = !sd.team && !!sd.projTeam;
  const r = info.r;
  const win = r.status === 'final' && !!sd.team && r.winner === sd.team;
  const lose = r.status === 'final' && !!sd.team && r.loser === sd.team;
  let s = `<g class="bk-row${win ? ' win' : ''}${lose ? ' lose' : ''}${proj ? ' proj' : ''}">`;
  if (win) s += `<rect class="bk-winbar" x="0" y="${ry + 5}" width="3" height="${RH - 10}" rx="1.5"/>`;
  if (id) {
    const t = M.T[id];
    const nm = t.name.length > 9 ? t.name.slice(0, 8) + '\u2026' : t.name;
    s += `<text class="bk-seed" x="10" y="${ry + 17}" text-anchor="middle">${st.seedOf[id]}</text>`;
    s += `<circle cx="25" cy="${ry + 13}" r="7.5" style="fill:var(--c${t.color})"/>`;
    s += `<text class="bk-badge-t${t.tag.length > 1 ? ' two' : ''}" x="25" y="${ry + (t.tag.length > 1 ? 16 : 16.8)}" text-anchor="middle" style="fill:var(--c${t.color}-ink)">${esc(t.tag)}</text>`;
    s += `<text class="bk-team" x="37" y="${ry + 17.5}">${esc(nm)}</text>`;
  } else s += `<text class="bk-ph" x="9" y="${ry + 17}">${esc(sd.short)}</text>`;
  const sc = info.scores[i];
  if (sc != null) s += `<text class="bk-score" x="${CW - 8}" y="${ry + 18.5}" text-anchor="end">${sc}</text>`;
  return s + '</g>';
}
function bkCard(x, y, id, po, st) {
  const g = M.gameById[id], info = po.games[id];

  s += `<text class="bk-label" x="0" y="-7">${esc(g.name)}</text>`;

  s += `<rect class="bk-card" width="${CW}" height="${CH}" rx="5"/>`;

function resultBox(x, y, label, id, note) {

function bkTreeSVG(L, ox, po, st, fin) {
  let lines = '', cards = '';
  L.list.forEach(n => n.kids.forEach(k => {
    const c = L.nodes[k.id];
    const x1 = ox + c.x + CW, y1 = c.top + CH / 2, x2 = ox + n.x, y2 = n.top + (k.i === 0 ? RH / 2 : RH * 1.5);
    const xm = x1 + (x2 - x1) / 2;
    lines += `<path class="bk-line${fin(k.id) ? ' on' : ''}" d="${y1 === y2 ? `M${x1} ${y1} H${x2}` : `M${x1} ${y1} H${xm} V${y2} H${x2}`}"/>`;
  }));
  L.list.forEach(n => { cards += bkCard(ox + n.x, n.top, n.id, po, st); });
  return { lines, cards };
}
function renderBrackets(st, po) {
  const fin = id => po.games[id].r.status === 'final';
  const finalG = M.poGames.find(g => g.places && g.places.w === 1);
  const L = layoutTree(finalG.id);
  const ox = Math.max(0, (VW - L.width) / 2);
  const t = bkTreeSVG(L, ox, po, st, fin);
  const bx = ox + L.root.x, by = L.root.top + CH + 24;
  const main = $('#bk-main');
  main.setAttribute('viewBox', `0 0 ${VW} ${Math.max(L.height, by + 40) + 8}`);
  main.innerHTML = t.lines + `<path class="bk-line${fin(finalG.id) ? ' on' : ''}" d="M${bx + CW / 2} ${L.root.top + CH} V${by}"/>` +

  const thirdG = M.poGames.find(g => g.third);

  const L3 = layoutTree(thirdG.id);
  const ox3 = Math.max(0, (VW - (L3.width + GX + CW)) / 2);

function fmtUpdated(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const today = new Date();
  const same = d.toDateString() === today.toDateString();
  try {
    const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    return same ? time : d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ', ' + time;
  } catch (e) { return d.toISOString().slice(0, 16).replace('T', ' '); }
}

}

/* ================= Score entry (organizer only) ================= */
function rowFor(inp) { return (inp.dataset.kind === 'pool' ? poolRows : poRows)[inp.dataset.game]; }
function onScoreInput(e) {
  const inp = e.target;
  if (!editing || !draft) return;
  const clean = inp.value.replace(/\D/g, '').slice(0, 2);
  if (clean !== inp.value) inp.value = clean;
  const val = clean === '' ? null : Number(clean);
  const id = inp.dataset.game, idx = Number(inp.dataset.idx);
  if (inp.dataset.kind === 'pool') {
    const g = M.pool.find(x => x.id === id);
    if (!g) return;
    const mine = poolScores(g);
    mine[idx] = val;
    const stored = g.t1 < g.t2 ? mine : [mine[1], mine[0]];
    if (stored[0] == null && stored[1] == null) delete draft.scores[g.key];
    else draft.scores[g.key] = stored;
  } else {
    const info = lastPo && lastPo.games[id];
    if (!info || !info.ready) return;
    const stored = draft.po[id];
    const matches = stored && stored.t[0] === info.teams[0] && stored.t[1] === info.teams[1];
    const s = matches ? stored.s.slice() : [null, null];
    s[idx] = val;
    if (s[0] == null && s[1] == null) delete draft.po[id];
    else draft.po[id] = { t: info.teams.slice(), s };
  }
  changed();
}
function onScoreFocus(e) {
  const inp = e.target;
  if (inp.readOnly) return;
  setTimeout(() => { try { inp.select(); } catch (err) { /* ignore */ } }, 0);
}
function onScoreBlur(e) {
  const inp = e.target;
  const v = inp.value.replace(/\D/g, '');
  const tidy = v === '' ? '' : String(Number(v));
  if (inp.value !== tidy) inp.value = tidy;
}
function onScoreKey(e) {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const inp = e.target;
  if (inp.dataset.idx === '0') rowFor(inp).ins[1].focus();
  else inp.blur();
}

/* ================= Editing, drafts and publishing ================= */
function saveDraft() {
  if (!draft) return;
  lsSet(LS.draft, JSON.stringify({ baseRev: published.rev, dirty: isDirty(), state: draft }));
}
function loadDraft() {
  try {
    const d = JSON.parse(lsGet(LS.draft));
    if (d && d.baseRev === published.rev && d.state) return normalize(d.state);
  } catch (e) { /* ignore */ }
  return null;
}
function changed() {
  pubError = '';
  saveDraft();
  updateAll();
  renderPubBar();
}
function startEditing() {
  if (!organizer) return;
  editing = true;
  draft = loadDraft() || clone(published);
  ssSet(SS.edit, '1');
  updateAll();
  renderPubBar();
  renderSheet();
}
function stopEditing() {
  if (isDirty()) return false;
  editing = false;
  draft = null;
  ssDel(SS.edit);
  lsDel(LS.draft);
  updateAll();
  renderPubBar();
  renderSheet();
  return true;
}
function countChanges() {
  if (!draft) return 0;
  const a = normalize(draft), b = published;
  let n = 0;
  if (JSON.stringify([a.settings, a.teams, a.schedule]) !== JSON.stringify([b.settings, b.teams, b.schedule])) n++;
  const diff = (x, y) => new Set(Object.keys(x).concat(Object.keys(y))).forEach(k => { if (JSON.stringify(x[k]) !== JSON.stringify(y[k])) n++; });
  diff(a.scores, b.scores);
  diff(a.po, b.po);
  if (JSON.stringify(a.flips) !== JSON.stringify(b.flips)) n++;
  return n;
}
let discardArmed = null;
function renderPubBar() {
  const bar = $('#pubbar');
  bar.hidden = !editing;
  if (!editing) return;
  const n = countChanges();
  $('#pub-text').textContent = publishing ? 'Publishing\u2026' : n ? plural(n, 'unpublished change', 'unpublished changes') : 'Everything is published';
  const discard = $('#pub-discard'), go = $('#pub-go');
  discard.hidden = !n || publishing;
  go.disabled = !n || publishing;
  if (!n && discardArmed) { clearTimeout(discardArmed); discardArmed = null; discard.textContent = 'Discard'; discard.classList.remove('armed'); }
  const err = $('#pub-err');
  err.hidden = !pubError;
  err.textContent = pubError;
}
/* ================= Server calls ================= */
async function api(path, opts) {
  const o = opts || {};
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), 12000) : null;
  try {
    const res = await fetch(API + path, {
      method: o.method || 'GET',
      headers: o.body ? { 'Content-Type': 'application/json' } : undefined,
      body: o.body ? JSON.stringify(o.body) : undefined,
      credentials: 'same-origin',
      cache: 'no-store',
      signal: ctl ? ctl.signal : undefined,
    });
    let data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    return { ok: res.ok, status: res.status, data: data || {} };
  } catch (e) {
    return { ok: false, status: 0, data: {} };
  } finally {
    if (timer) clearTimeout(timer);
  }
}
let firstSync = true;
// Pull the latest published tournament. The server copy wins on first load; after that only newer versions apply.
async function refresh() {
  const r = await api('/tournament');
  if (!r.ok) {
    if (r.status === 0 || r.status === 404) server.reachable = false;
    renderHeader();
    return;
  }
  server.reachable = true;
  const raw = r.data.data;
  if (raw) {
    const next = normalize(raw);
    const differs = next.rev !== published.rev || contentOf(next) !== contentOf(published);
    if ((firstSync || next.rev > published.rev) && differs) {
      const wasDirty = isDirty();
      published = next;
      if (editing && draft) {
        if (!wasDirty) draft = clone(published);
        else pubError = 'A newer version was saved from another device. Publish to replace it with yours, or Discard to load it.';
        saveDraft();
      }
      updateAll();
      renderPubBar();
    }
  }
  firstSync = false;
  renderHeader();
}
async function checkSession() {
  const r = await api('/session');
  if (r.ok) {
    server.reachable = true;
    server.database = !!r.data.database;
    server.login = !!r.data.login;
    server.hint = typeof r.data.databaseHint === 'string' ? r.data.databaseHint : '';
    organizer = !!r.data.organizer;
  } else {
    organizer = false;
    if (r.status === 0 || r.status === 404) server.reachable = false;
  }
}
async function signIn(username, password) {
  if (signingIn) return;
  signingIn = true;
  signinError = '';
  renderSheet();
  const r = await api('/login', { method: 'POST', body: { username, password } });
  signingIn = false;
  if (r.ok && r.data.organizer) {
    organizer = true;
    renderSheet();
    showToast('Signed in');
    return;
  }
  signinError = r.status === 0 ? 'Could not reach the server. Check your connection and try again.' : (r.data.error || 'Sign-in failed.');
  renderSheet();
  const pw = $('#si-pass');
  if (pw) { pw.value = ''; pw.focus(); }
}
async function signOut() {
  if (isDirty()) { signinError = 'Publish or discard your changes before you sign out.'; renderSheet(); return; }
  await api('/logout', { method: 'POST' });
  organizer = false;
  editing = false;
  draft = null;
  ssDel(SS.edit);
  lsDel(LS.draft);
  updateAll(); renderPubBar(); renderSheet();
  showToast('Signed out');
}
async function publishNow() {
  if (!editing || !draft || publishing) return;
  const next = normalize(clone(draft));
  publishing = true;
  pubError = '';
  renderPubBar();
  saveDraft();
  const r = await api('/tournament', { method: 'PUT', body: { data: next, baseRev: published.rev } });
  publishing = false;
  if (r.ok && r.data.data) {
    published = normalize(r.data.data);
    draft = clone(published);
    lsDel(LS.draft);
    updateAll(); renderPubBar(); renderSheet();
    showToast('Published');
    return;
  }
  if (r.status === 409 && r.data.data) {
    published = normalize(r.data.data);
    saveDraft();
    pubError = 'A newer version was saved from another device. Publish again to replace it with yours, or Discard to load it.';
  } else if (r.status === 401) {
    organizer = false;
    editing = false;
    draft = null;
    updateAll(); renderPubBar(); renderSheet();
    showToast('Your sign-in expired. Open Menu and sign in again. Your changes are kept on this device.');
    return;
  } else if (r.status === 0) pubError = 'Could not reach the server. Your changes are kept on this device; try again.';
  else pubError = (r.data.error || 'Publishing failed.') + ' Your changes are kept on this device.';
  updateAll();
  renderPubBar();
}
function wirePubBar() {
  $('#pub-go').addEventListener('click', publishNow);
  $('#pub-discard').addEventListener('click', () => {
    const b = $('#pub-discard');
    if (!discardArmed) {
      b.textContent = 'Tap again to discard';
      b.classList.add('armed');
      discardArmed = setTimeout(() => { discardArmed = null; b.textContent = 'Discard'; b.classList.remove('armed'); }, 4000);
      return;
    }
    clearTimeout(discardArmed); discardArmed = null;
    b.textContent = 'Discard'; b.classList.remove('armed');
    draft = clone(published);
    lsDel(LS.draft);
    form = null;
    changed();
    renderSheet();
  });
}

      `<button class="btn-quiet" type="button" id="sh-signout"${dirty ? ' disabled' : ''}>Sign out</button></div></div></div>`;
  }
  html += '</section>';
  if (editing) html += '<section class="sheet-sec" id="settings"></section>';
  body.innerHTML = html;
  const siForm = $('#si-form');
  if (siForm) siForm.addEventListener('submit', e => {
    e.preventDefault();
    const u = $('#si-user').value.trim(), p = $('#si-pass').value;
    if (!u || !p) { signinError = 'Enter your username and password.'; renderSheet(); return; }
    signIn(u, p);
  });
  const start = $('#sh-start');
  if (start) start.addEventListener('click', () => { signinError = ''; startEditing(); });
  const stop = $('#sh-stop');
  if (stop) stop.addEventListener('click', () => { if (stopEditing()) closeSheet(); });
  const out = $('#sh-signout');
  if (out) out.addEventListener('click', () => { signOut(); });
  if (editing) { if (!form) form = formFromDraft(); renderSettings(); }
}

function renderSettings() {
  const sec = $('#settings');
  if (!sec || !form) return;
  const n = form.teams.length;
  const maxPo = Math.min(n, LIMIT.maxPlayoff);
  if (form.playoffTeams > maxPo) form.playoffTeams = maxPo;
  let html = '<h3>Tournament settings</h3>' +
    `<label class="field"><span>Tournament name</span><input id="f-title" maxlength="60" value="${esc(form.title)}"></label>` +
    '<div class="grid3">' +
      `<label class="field"><span>Courts</span><select id="f-courts">${[1, 2, 3, 4].map(c => `<option value="${c}"${c === form.courts ? ' selected' : ''}>${c}</option>`).join('')}</select></label>` +
      `<label class="field"><span>Minutes</span><input id="f-minutes" inputmode="numeric" maxlength="2" value="${esc(form.minutes)}"></label>` +
      `<label class="field"><span>First to</span><input id="f-points" inputmode="numeric" maxlength="2" value="${esc(form.points)}"></label>` +
    '</div>' +
    `<h4>Teams (${n})</h4><div id="f-teams">`;
  form.teams.forEach((t, i) => {
    html += `<div class="team-edit" data-i="${i}">` +
      `<div class="te-head"><span class="badge tc${t.color}${t.tag.length > 1 ? ' two' : ''}" aria-hidden="true">${esc(t.tag || '?')}</span><strong>${esc(t.name || 'New team')}</strong>` +
      `<button class="link-btn" type="button" data-remove="${i}"${n <= LIMIT.minTeams ? ' disabled' : ''}>Remove</button></div>` +
      `<label class="field"><span>Team name</span><input data-f="name" maxlength="30" value="${esc(t.name)}"></label>` +
      `<label class="field"><span>Badge</span><input data-f="tag" maxlength="2" value="${esc(t.tag)}"></label>` +
      `<label class="field wide"><span>Players, separated by commas</span><input data-f="players" value="${esc(t.players)}" autocomplete="off"></label>` +
      '</div>';
  });
  html += '</div>' +
    `<button class="btn-quiet" type="button" id="f-add"${n >= LIMIT.maxTeams ? ' disabled' : ''}>Add team</button>` +
    '<h4>Playoffs</h4>' +
    `<label class="field"><span>Teams in the playoffs</span><select id="f-po">${Array.from({ length: maxPo - 1 }, (_, k) => k + 2).map(p => `<option value="${p}"${p === form.playoffTeams ? ' selected' : ''}>${p}</option>`).join('')}</select></label>` +
    `<label class="check"><input type="checkbox" id="f-third"${form.thirdPlace ? ' checked' : ''}><span>3rd place game</span></label>` +
    '<p class="fine" id="f-po-note"></p>' +
    '<h4>Schedule</h4>' +
    '<p class="fine" id="f-sched-note"></p>' +
    `<label class="check"><input type="checkbox" id="f-shuffle"${form.shuffle ? ' checked' : ''}><span>Shuffle matchups when saving</span></label>` +
    `<p class="form-error" id="f-error"${formError ? '' : ' hidden'}>${esc(formError)}</p>` +
    '<div class="form-actions"><button class="btn" type="button" id="f-save">Save and publish</button></div>' +
    '<h4>New tournament</h4>' +
    '<p class="fine">Clears every pool and playoff score in your draft. Teams and settings stay as they are.</p>' +
    '<div class="form-actions"><button class="btn-quiet danger" type="button" id="f-clear">Clear all scores</button></div>';
  sec.innerHTML = html;
  updateFormNotes();
}
function teamIdsChanged(f) {
  return f.teams.map(t => t.id).sort().join(',') !== draft.teams.map(t => t.id).sort().join(',');
}
function updateFormNotes() {
  if (!form) return;
  const n = form.teams.length;
  const courts = Number(form.courts);
  const games = n * (n - 1) / 2;
  const sameTeams = !teamIdsChanged(form);
  const rounds = sameTeams && !form.shuffle
    ? (courts === draft.settings.courts ? draft.schedule.length : packGames(draft.schedule.reduce((a, r) => a.concat(r), []), courts).length)
    : makeSchedule(form.teams.map(t => t.id), courts, false).length;
  const mins = Number(form.minutes) || 12;
  const sched = $('#f-sched-note');
  if (sched) sched.textContent = `${plural(games, 'pool game', 'pool games')} in ${plural(rounds, 'round', 'rounds')}, about ${rounds * (mins + 3)} minutes with 3 minutes between games.` +
    (sameTeams ? '' : ' Changing the teams builds a new schedule.');
  const P = Number(form.playoffTeams);
  const note = $('#f-po-note');
  if (note) {
    const shape = buildBracket(P, form.thirdPlace);
    const pr = schedulePlayoffs(shape, courts).length;
    const byes = Math.pow(2, Math.ceil(Math.log2(P))) - P;
    note.textContent = (P === 5 && form.thirdPlace
      ? 'Five teams uses the play-in format: seed 1 waits for the play-in winner, and a consolation game decides who plays for 3rd.'
      : `${plural(shape.length, 'playoff game', 'playoff games')}.` + (byes ? ` The top ${byes === 1 ? 'seed gets a first-round bye' : byes + ' seeds get first-round byes'}.` : '')) +
      ` ${plural(pr, 'playoff round', 'playoff rounds')} on ${plural(courts, 'court', 'courts')}.`;
  }
}
function nextTeamDefaults() {
  const usedIds = new Set(form.teams.map(t => t.id).concat(draft.teams.map(t => t.id)));
  let k = 1;
  while (usedIds.has('t' + k)) k++;
  const usedTags = new Set(form.teams.map(t => t.tag.toUpperCase()));
  const letter = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').find(l => !usedTags.has(l)) || String(k);
  const usedColors = new Set(form.teams.map(t => t.color));
  let color = 0;
  while (usedColors.has(color) && color < LIMIT.colors - 1) color++;
  return { id: 't' + k, name: 'Team ' + letter, tag: letter, color, players: '' };
}
function readPlayers(s) { return s.split(/[,\n]/).map(p => cleanStr(p, 30)).filter(Boolean); }
function validateForm() {
  const f = form;
  if (!cleanStr(f.title, 60)) return 'Give the tournament a name.';
  const minutes = Number(f.minutes), points = Number(f.points);
  if (!Number.isInteger(minutes) || minutes < 1 || minutes > 60) return 'Minutes per game must be a whole number from 1 to 60.';
  if (!Number.isInteger(points) || points < 1 || points > 99) return 'Points to win must be a whole number from 1 to 99.';
  if (f.teams.length < LIMIT.minTeams || f.teams.length > LIMIT.maxTeams) return `Use between ${LIMIT.minTeams} and ${LIMIT.maxTeams} teams.`;
  const names = new Set(), tags = new Set();
  for (let i = 0; i < f.teams.length; i++) {
    const t = f.teams[i];
    const nm = cleanStr(t.name, 30), tg = cleanStr(t.tag, 2);
    if (!nm) return `Team ${i + 1} needs a name.`;
    if (!tg) return `${nm} needs a badge of 1 or 2 characters.`;
    if (names.has(nm.toLowerCase())) return `Two teams are named ${nm}. Team names must be different.`;
    if (tags.has(tg.toLowerCase())) return `Two teams use the badge ${tg}. Badges must be different.`;
    names.add(nm.toLowerCase()); tags.add(tg.toLowerCase());
    const pl = readPlayers(t.players);
    if (!pl.length) return `Add at least one player to ${nm}.`;
    if (pl.length > LIMIT.maxPlayers) return `${nm} has more than ${LIMIT.maxPlayers} players.`;
  }
  return '';
}
function applyForm() {
  const f = form;
  const teams = f.teams.map(t => ({ id: t.id, name: cleanStr(t.name, 30), tag: cleanStr(t.tag, 2), color: t.color, players: readPlayers(t.players) }));
  const ids = teams.map(t => t.id);
  const courts = Number(f.courts);
  const teamsChanged = teamIdsChanged(f);
  let schedule = draft.schedule;
  if (teamsChanged || f.shuffle) schedule = makeSchedule(ids, courts, true);
  else if (courts !== draft.settings.courts) schedule = packGames(draft.schedule.reduce((a, r) => a.concat(r), []), courts);
  const P = Math.min(Number(f.playoffTeams), ids.length, LIMIT.maxPlayoff);
  const bracketChanged = teamsChanged || P !== draft.settings.playoffTeams || f.thirdPlace !== draft.settings.thirdPlace;
  const idSet = new Set(ids);
  const scores = {};
  Object.keys(draft.scores).forEach(k => { const p = k.split('|'); if (idSet.has(p[0]) && idSet.has(p[1])) scores[k] = draft.scores[k]; });
  const flips = {};
  Object.keys(draft.flips).forEach(k => { if (k.split(',').every(x => idSet.has(x))) flips[k] = draft.flips[k]; });
  draft = normalize({
    v: 2, rev: draft.rev, updated: draft.updated,
    settings: { title: cleanStr(f.title, 60), courts, minutes: Number(f.minutes), points: Number(f.points), playoffTeams: P, thirdPlace: !!f.thirdPlace },
    teams, schedule, scores, po: bracketChanged ? {} : draft.po, flips,
  });
}
function onSheetInput(e) {
  if (!form) return;
  const t = e.target;
  if (formError) { formError = ''; const fe = $('#f-error'); if (fe) fe.hidden = true; }
  if (t.id === 'f-title') form.title = t.value;
  else if (t.id === 'f-minutes') { t.value = t.value.replace(/\D/g, '').slice(0, 2); form.minutes = t.value; updateFormNotes(); }
  else if (t.id === 'f-points') { t.value = t.value.replace(/\D/g, '').slice(0, 2); form.points = t.value; }
  else if (t.id === 'f-courts') { form.courts = Number(t.value); updateFormNotes(); }
  else if (t.id === 'f-po') { form.playoffTeams = Number(t.value); updateFormNotes(); }
  else if (t.id === 'f-third') { form.thirdPlace = t.checked; updateFormNotes(); }
  else if (t.id === 'f-shuffle') { form.shuffle = t.checked; updateFormNotes(); }
  else if (t.dataset && t.dataset.f) {
    const box = t.closest('.team-edit');
    const team = box && form.teams[Number(box.dataset.i)];
    if (!team) return;
    team[t.dataset.f] = t.value;
    if (t.dataset.f === 'name') box.querySelector('.te-head strong').textContent = t.value || 'New team';
    if (t.dataset.f === 'tag') {
      const b = box.querySelector('.te-head .badge');
      b.textContent = t.value || '?';
      b.classList.toggle('two', t.value.length > 1);
    }
  }
}
function onSheetClick(e) {
  const t = e.target;
  if (t.closest('#sheet-close')) { closeSheet(); return; }
  if (t === $('#sheet')) { closeSheet(); return; }
  if (!form) return;
  const rm = t.closest('[data-remove]');
  if (rm && !rm.disabled) {
    form.teams.splice(Number(rm.dataset.remove), 1);
    renderSettings();
    return;
  }
  if (t.closest('#f-add')) {
    if (form.teams.length >= LIMIT.maxTeams) return;
    form.teams.push(nextTeamDefaults());
    renderSettings();
    const boxes = document.querySelectorAll('.team-edit');
    const last = boxes[boxes.length - 1];
    if (last) { last.scrollIntoView({ block: 'center' }); const inp = last.querySelector('[data-f="players"]'); if (inp) inp.focus(); }
    return;
  }
  if (t.closest('#f-save')) {
    formError = validateForm();
    const err = $('#f-error');
    if (formError) { err.textContent = formError; err.hidden = false; err.scrollIntoView({ block: 'center' }); return; }
    err.hidden = true;
    applyForm();
    form = formFromDraft();
    changed();
    closeSheet();
    publishNow();
    return;
  }
  if (t.closest('#f-clear')) {
    const b = $('#f-clear');
    if (!clearArmed) {
      b.textContent = 'Tap again to clear every score';
      b.classList.add('armed');
      clearArmed = setTimeout(() => { clearArmed = null; b.textContent = 'Clear all scores'; b.classList.remove('armed'); }, 4000);
      return;
    }
    clearTimeout(clearArmed); clearArmed = null;
    draft.scores = {}; draft.po = {}; draft.flips = {};
    changed();
    b.textContent = 'Scores cleared. Publish to make it live.';
    b.classList.remove('armed');
    b.disabled = true;
  }
}

/* ================= Navigation ================= */
const TABS = ['pool', 'standings', 'playoffs'];
function selectTab(name, focus) {
  if (TABS.indexOf(name) < 0) name = 'pool';
  TABS.forEach(t => {
    const tab = $('#tab-' + t), panel = $('#panel-' + t), on = t === name;
    tab.setAttribute('aria-selected', on ? 'true' : 'false');
    tab.tabIndex = on ? 0 : -1;
    panel.hidden = !on;
    if (on && focus) tab.focus();
  });
  lsSet(LS.tab, name);
}
function goToGame(id) {
  const isPool = !!poolRows[id];
  const ref = (isPool ? poolRows : poRows)[id];
  if (!ref) return;
  selectTab(isPool ? 'pool' : 'playoffs');
  requestAnimationFrame(() => {
    ref.row.scrollIntoView({ block: 'center', behavior: reduceMotion() ? 'auto' : 'smooth' });
    ref.row.classList.remove('flash');
    void ref.row.offsetWidth;
    ref.row.classList.add('flash');
    setTimeout(() => ref.row.classList.remove('flash'), 1500);
  });
}
let toastTimer = null;
function showToast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
}
function saveScroll() { ssSet(SS.scroll, String(Math.round(window.scrollY || 0))); }

/* ================= Live updates ================= */
let pollTimer = null;
function schedulePoll() {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(async () => {
    if (document.visibilityState === 'visible' && !publishing) await refresh();
    schedulePoll();
  }, POLL_MS);
}

/* ================= Start ================= */
function start() {
  buildShell();
  selectTab(lsGet(LS.tab) || 'pool');
  updateAll();
  renderPubBar();
  const y = Number(ssGet(SS.scroll));
  if (y > 0) requestAnimationFrame(() => window.scrollTo(0, y));

  document.addEventListener('click', e => {
    const flip = e.target.closest('[data-flip]');
    if (flip && editing && draft) {
      const ids = flip.dataset.flip.split(',').filter(id => M.T[id]);
      if (ids.length >= 2) { draft.flips[ids.slice().sort().join(',')] = shuffle(ids); changed(); }
      return;
    }
    const go = e.target.closest('[data-goto]');
    if (go) { goToGame(go.dataset.goto); return; }
    const tabBtn = e.target.closest('[data-tab]');
    if (tabBtn) selectTab(tabBtn.dataset.tab);
  });
  TABS.forEach((t, i) => {
    const tab = $('#tab-' + t);
    tab.addEventListener('click', () => selectTab(t));
    tab.addEventListener('keydown', e => {
      let j = null;
      if (e.key === 'ArrowRight') j = (i + 1) % TABS.length;
      else if (e.key === 'ArrowLeft') j = (i + TABS.length - 1) % TABS.length;
      else if (e.key === 'Home') j = 0;
      else if (e.key === 'End') j = TABS.length - 1;
      if (j != null) { e.preventDefault(); selectTab(TABS[j], true); }
    });
  });
  $('#menu-btn').addEventListener('click', openSheet);
  $('#sheet').addEventListener('click', onSheetClick);
  $('#sheet').addEventListener('input', onSheetInput);
  $('#sheet').addEventListener('change', onSheetInput);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
  wirePubBar();
  let ticking = false;
  window.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { ticking = false; saveScroll(); });
  }, { passive: true });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !publishing) refresh(); });
  Promise.all([refresh(), checkSession()]).then(() => {
    try {
      const rec = JSON.parse(lsGet(LS.draft));
      if (rec && rec.baseRev !== published.rev) {
        lsDel(LS.draft);
        if (rec.dirty) showToast('A newer version was published, so your unpublished changes were not kept.');
      }
    } catch (e) { lsDel(LS.draft); }
    if (organizer && ssGet(SS.edit) === '1') startEditing();
    else { if (!organizer) ssDel(SS.edit); renderSheet(); renderPubBar(); }
    renderHeader();
    schedulePoll();
  });
}
start();
}
tournamentApp();
</script>
